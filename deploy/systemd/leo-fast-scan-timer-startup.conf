# Install as leo-v052-adaptive.timer.d/zzzzz-fast-v16-startup.conf.
# Empty monotonic timer assignments clear all inherited monotonic triggers.
# Set both triggers after the reset so an idle Start schedules its first run.
[Timer]
OnCalendar=
OnBootSec=
OnActiveSec=20min
OnUnitInactiveSec=20min
AccuracySec=1s
RandomizedDelaySec=0
Persistent=false
