[Unit]
Description=Automatic adaptive and fast eight-channel scans on radio .20

[Service]
Environment=PYTHONPATH=/opt/leo-fast-auto/20261010-r2/worker/src
ExecStart=
ExecStart=/usr/bin/flock --wait 5 /run/leo-adaptive-pipeline.lock /opt/leo-fast-auto/20261010-r1/venv/bin/python /opt/leo-shared-scans/20261010-r2/bin/run_shared_scan_cycle.py --config /opt/leo-shared-scans/20261010-r1/capture-config.json --state /srv/bulk/leo/shared-scan-schedule/state.json
ExecStartPre=+/usr/bin/install -d -o leo -g leo -m 0750 /srv/bulk/leo/shared-scan-schedule
ReadWritePaths=/srv/bulk/leo/shared-scan-schedule /srv/bulk/leo/control /srv/bulk/leo/fast-scan-automatic /srv/postgres-nvme/fast-scan-recordings
TimeoutStartSec=450
TimeoutStopSec=75
KillSignal=SIGINT
Restart=no
