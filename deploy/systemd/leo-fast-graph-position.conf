[Service]
# Replace @RELEASE@ with the immutable, qualified release path at cutover.
WorkingDirectory=@RELEASE@
Environment=PYTHONPATH=@RELEASE@/src:@RELEASE@/tools
ExecStart=
ExecStart=@RELEASE@/venv/bin/python -B -m leo.cli.fast_graph_position --bulk-root /srv/bulk/leo --maximum-seconds 1200
ExecStartPre=+/usr/bin/install -d -o leo -g leo -m 0750 /srv/bulk/leo/fast-scan-graph-position-v1
TimeoutStopSec=15
KillMode=control-group
