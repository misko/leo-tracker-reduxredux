[Unit]
Description=Automatic adaptive and fast scans: twenty-minute gap after each five-minute capture

[Timer]
OnCalendar=
OnBootSec=
# An empty monotonic assignment clears inherited triggers; set both after it.
OnActiveSec=20min
OnUnitInactiveSec=20min
AccuracySec=1s
RandomizedDelaySec=0
Persistent=false
