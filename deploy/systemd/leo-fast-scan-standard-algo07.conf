[Service]
# Overlay only the orchestration files on the installed native-rate GLRT release.
# The staged native worker preserves every other installed source byte.
Environment=PYTHONPATH=@RELEASE@/native-worker/src
ExecStart=
ExecStart=/opt/leo-fast-auto/20261010-r1/venv/bin/python -B -m leo.cli.fast_scan --recording-root /srv/bulk/leo/fast-scan-recordings --bulk-root /srv/bulk/leo --standard-mode algo07 --capture-serial 1040005e0b100007100010000bf33a5d4d --staging-root /srv/postgres-nvme/fast-scan-recordings
