[Unit]
Description=Automatic adaptive and fast eight-channel scans on radio .20 at fixed 10 MS/s

[Service]
Environment=PYTHONDONTWRITEBYTECODE=1
Environment=PYTHONPATH=/opt/leo-shared-scans/v063-10m-0eab0c85fa2aac69/worker/src:/opt/leo-shared-scans/v063-10m-0eab0c85fa2aac69/pluto/src
ExecStart=
ExecStart=/usr/bin/flock --wait 5 /run/leo-adaptive-pipeline.lock /opt/leo-fast-auto/20261010-r1/venv/bin/python /opt/leo-shared-scans/v063-10m-0eab0c85fa2aac69/bin/run_shared_scan_cycle.py --config /opt/leo-shared-scans/v063-10m-0eab0c85fa2aac69/capture-config.json --state /srv/bulk/leo/shared-scan-schedule/state.json
