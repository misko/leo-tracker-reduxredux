[Unit]
Description=Automatic 10 MS/s scans with NVMe staging and verified RAID publication
RequiresMountsFor=/srv/bulk/leo /srv/postgres-nvme/fast-scan-recordings /srv/postgres-nvme/leo-scanner-staging

[Service]
Environment=MPLCONFIGDIR=/srv/bulk/leo/presentation-cache/matplotlib
ExecStart=
ExecStart=/usr/bin/flock --wait 5 /run/leo-adaptive-pipeline.lock /opt/leo-fast-auto/20261010-r1/venv/bin/python /opt/leo-shared-scans/v063-10m-0eab0c85fa2aac69/bin/run_shared_scan_cycle.py --config /opt/leo-shared-scans/staging-to-raid-b7d03364d3fded75/capture-config.json --state /srv/bulk/leo/shared-scan-schedule/state.json
ReadWritePaths=
ReadWritePaths=/srv/bulk/leo/v052-adaptive-live /srv/postgres-nvme/leo-scanner-staging/v052-adaptive /srv/bulk/leo/shared-scan-schedule /srv/bulk/leo/control /srv/bulk/leo/fast-scan-automatic /srv/postgres-nvme/fast-scan-recordings /srv/bulk/leo/presentation-cache/matplotlib
