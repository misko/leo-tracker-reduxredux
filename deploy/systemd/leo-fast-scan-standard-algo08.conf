[Unit]
Description=Analyze new Gauss fast recordings with ALGO08
[Service]
Environment=ALGO08_REGION_FILE=@RELEASE@/station/region.json
Environment=ALGO08_EVALUATION_LATITUDE=37.849061591561885
Environment=ALGO08_EVALUATION_LONGITUDE=-122.48574968092912
ExecStart=
ExecStart=/opt/leo-fast-auto/20261010-r1/venv/bin/python -B @RELEASE@/src/leo/cli/fast_scan.py --recording-root /srv/bulk/leo/fast-scan-recordings --bulk-root /srv/bulk/leo --standard-mode algo08 --algo08-launcher @RELEASE@/run --glrt-workers 16 --capture-serial 1040005e0b100007100010000bf33a5d4d --staging-root /srv/postgres-nvme/fast-scan-recordings
