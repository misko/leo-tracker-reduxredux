[Unit]
Description=Analyze sealed Gauss fast recordings with ALGO08v3
[Service]
Environment=PYTHONPATH=@RELEASE@/src
Environment=TMPDIR=/srv/bulk/leo/presentation-cache/tmp
Environment=ALGO08_EVALUATION_LATITUDE=37.849061591561885
Environment=ALGO08_EVALUATION_LONGITUDE=-122.48574968092912
ExecStartPre=
ExecStartPre=+/usr/bin/install -d -o leo -g leo -m 0750 /srv/bulk/leo/fast-scan-automatic-work /srv/bulk/leo/fast-scan-automatic /srv/bulk/leo/fast-scan-inputs /srv/bulk/leo/fast-scan-reports /srv/bulk/leo/fast-scan-standard-v2 /srv/bulk/leo/presentation-cache/tmp
ExecStartPre=/opt/leo-algo08/algo08v3/run --verify
ExecStart=
ExecStart=/opt/leo-fast-auto/20261010-r1/venv/bin/python -B -m leo.cli.fast_scan --recording-root /srv/bulk/leo/fast-scan-recordings --bulk-root /srv/bulk/leo --capture-serial 1040005e0b100007100010000bf33a5d4d --staging-root /srv/postgres-nvme/fast-scan-recordings
