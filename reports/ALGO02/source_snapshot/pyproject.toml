[build-system]
requires = ["setuptools>=75,<82", "wheel", "numpy>=2.0,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-tracker"
version = "0.1.0"
description = "Modular Pluto+ acquisition and Starlink analysis platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "sgp4>=2.23,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "zstandard>=0.23,<1",
]

[project.scripts]
leo = "leo.cli:main"
leo-api = "leo.api.production:main"
leo-release-qualify = "leo.qualification.release:main"
leo-legacy-oracle = "leo.qualification.legacy_oracle:main"

[project.optional-dependencies]
hardware = [
    "pluto-plus-utils[hardware]",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "hardware: requires a declared CPU or device capability",
  "legacy_oracle: requires the frozen local legacy checkout and environment manifest",
  "postgres: requires an isolated schema in the configured real PostgreSQL test database",
  "real_corpus: requires the protected materialized corpus under /srv/bulk/leo/test-corpus",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
# This scientific implementation is hash-pinned by a reviewed performance
# receipt. Reformatting it invalidates that evidence without changing behavior.
exclude = ["src/leo/analysis/starlink/multi_target.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[[tool.mypy.overrides]]
# The sgp4 distribution ships no py.typed marker.
module = ["sgp4.*"]
ignore_missing_imports = true

[tool.uv.sources]
pluto-plus-utils = { git = "https://github.com/misko/pluto-plus-utils", rev = "d5cd29301c5b36b3d65f8433af1508f2650eadea" }
