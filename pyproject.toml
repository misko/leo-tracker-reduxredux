[build-system]
requires = ["setuptools>=75,<82", "wheel", "numpy>=2.0,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-tracker"
version = "0.1.0"
description = "Modular Pluto+ acquisition and Starlink analysis platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "sgp4>=2.23,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "zstandard>=0.23,<1",
]

[project.scripts]
leo = "leo.cli:main"
leo-api = "leo.api.production:main"
leo-release-qualify = "leo.qualification.release:main"
leo-legacy-oracle = "leo.qualification.legacy_oracle:main"
leo-persistent-hop-analysis = "leo.cli.persistent_hop_analysis:main"
leo-adaptive-hop-analysis = "leo.cli.adaptive_hop_analysis:main"

[project.optional-dependencies]
hardware = [
    "pluto-plus-utils[hardware]",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "hardware: requires a declared CPU or device capability",
  "legacy_oracle: requires the frozen local legacy checkout and environment manifest",
  "postgres: requires an isolated schema in the configured real PostgreSQL test database",
  "real_corpus: requires the protected materialized corpus under /srv/bulk/leo/test-corpus",
  "fftw: requires an explicit FFTW_PREFIX native development installation",
  "libiio_integration: requires explicitly supplied libiio sources or built GLRT loopback artifacts; no RF",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# This report subtree is a byte-preserving forensic archive whose file hashes
# are recorded in its snapshot manifest.  It is evidence, not live source.
extend-exclude = [
  "reports/2026_08_25_post_refill_24h_retrospective/code/snapshot",
  # These retained execution recipes are hash-bound by their archive manifests.
  # tests/deploy/test_archived_glrt_evidence.py verifies their original bytes.
  "reports/evidence/2026_09_08_arm_presence_300s",
  "reports/evidence/2026_09_08_scanner_glrt_package_arm",
  "reports/evidence/2026_09_08_scanner_glrt_sdk_replay",
  "reports/evidence/2026_09_08_scanner_glrt_userspace_bundle",
  # Scientific source snapshots are bound by publication-manifest.json.
  "reports/figures/2026_09_12_paired_glrt_pss_tle",
]

[tool.ruff.format]
# These scientific implementations are hash-pinned by reviewed evidence.
# Reformatting them invalidates that evidence without changing behavior.
exclude = [
  "src/leo/analysis/starlink/multi_target.py",
  "reports/figures/2026_08_25_counter_continuous_frame_timing/source/run_new_continuity_probe.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[[tool.mypy.overrides]]
# The sgp4 distribution ships no py.typed marker.
module = ["sgp4.*"]
ignore_missing_imports = true

[tool.uv.sources]
pluto-plus-utils = { git = "https://github.com/misko/pluto-plus-utils", rev = "b513e0b0dab1c15ce790317b35b5edf1abbacfff" }
